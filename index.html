<!doctype html>
<html lang="si"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B1F5C" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'none'">
<title>මගේ දවස</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&family=Noto+Sans+Sinhala:wght@400;600;800&display=swap" rel="stylesheet">

<script src="assets/theme-init.js?v=__BUILD__"></script>
<link rel="stylesheet" href="assets/app.css?v=__BUILD__">
</head><body>
<div class="app">
  <header class="top">
    <div><h1 id="hi"></h1><small id="dt"></small></div>
    <span id="lastBackup" aria-live="polite"></span>
    <button class="icon" id="themeBtn" data-act="theme" aria-label="Theme">◑</button>
    <button class="icon" id="langBtn" data-act="setlang" aria-label="Language">සිං / EN</button>
    <button class="icon" data-act="tab" data-tab="set" aria-label="Settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></button>
  </header>
  <!-- Backup reminder banner (shown if >30 days or never + 10+ records) -->
  <div id="backupBanner" style="display:none" role="status" aria-live="polite"></div>
  <!-- Storage error banner -->
  <div id="storageErr" style="display:none" role="alert"></div>
  <main id="view"></main>
</div>
<nav class="nav">
  <button data-act="tab" data-tab="today"><svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>අද</button>
  <button data-act="tab" data-tab="spend"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M16 13h2M3 10h18"/></svg>වියදම්</button>
  <button class="fab" data-act="add" aria-label="Add">+</button>
  <button data-act="tab" data-tab="remind"><svg class="i" viewBox="0 0 24 24"><path d="M6 17v-6a6 6 0 0 1 12 0v6l2 2H4zM10 21h4"/></svg>මතක්</button>
  <button data-act="tab" data-tab="bday"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 14h18M12 9c-3 0-4-4-1.5-4S12 9 12 9zM12 9c3 0 4-4 1.5-4S12 9 12 9z"/></svg>උපන්දින</button>
</nav>
<div id="ov" class="ov" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div></div>
<script src="assets/i18n.js?v=__BUILD__"></script>
<script src="assets/app.js?v=__BUILD__"></script>
