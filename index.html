<div class="app"><div class="page">
  <header class="top">
    <div class="top-t"><p class="eyebrow" id="dt"></p><h1 id="hi"></h1></div>
    <button class="iconbtn ai" id="aiBtn" data-act="tab" data-tab="chat" data-i18n-aria="tab_chat" aria-label="Assistant"><svg class="i"><use href="#i-chat"/></svg></button>
  </header>
  <div id="backupBanner" class="banner" role="status" hidden></div>
  <main id="view" tabindex="-1"></main>
</div></div>

<button class="fab" id="fab" data-act="add" data-i18n-aria="btn_add_new" aria-label="Add new"><svg class="i"><use href="#i-plus"/></svg></button>
<form id="composer" class="composer" autocomplete="off" hidden>
  <textarea id="chatInput" rows="1" maxlength="500" enterkeyhint="send" data-i18n-ph="chat_ph" placeholder="Ask anything about your day…" aria-label="Message"></textarea>
  <button type="submit" class="send" id="chatSend" data-i18n-aria="chat_send" aria-label="Send"><svg class="i"><use href="#i-send"/></svg></button>
</form>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="ov" class="ov" data-act="close"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div></div>

<!-- PIN lock (static markup so nothing flashes before JS runs) -->
<section id="lock" class="lock" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
  <div class="lock-card">
    <img class="lock-logo" src="assets/icon-192-v2.png" alt="" width="72" height="72">
    <h2 id="lockTitle" data-i18n="pin_enter">Enter PIN</h2>
    <div class="dots" id="pinDots" aria-hidden="true"></div>
    <p class="pin-msg" id="pinMsg" role="alert"></p>
    <div class="keypad" id="keypad"></div>
    <button class="link" id="pinForgotBtn" data-act="pinforgot" data-i18n="pin_forgot">Forgot PIN?</button>
    <div class="forgot" id="forgotPanel" hidden>
      <h2 data-i18n="pin_forgot_t">Reset your PIN?</h2>
      <p data-i18n="pin_forgot_d"></p>
      <button class="btn dangerfill block" data-act="pinreset" data-i18n="pin_forgot_go"></button>
      <button class="btn block" data-act="pinforgotback" data-i18n="pin_back"></button>
    </div>
  </div>
</section>

<input type="file" id="importFile" accept=".json,application/json" hidden>
